[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cerebrus-pulse"
version = "0.4.0"
description = "Python SDK for Cerebrus Pulse — real-time crypto intelligence API for Hyperliquid perpetuals"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "0xsl1m", email = "sl1m@ghost.love" },
]
keywords = [
    "crypto", "technical-analysis", "hyperliquid", "x402", "micropayments",
    "trading", "ai-agent", "cerebrus-pulse", "USDC", "defi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Automatic x402 payment in USDC on Base (x402 v2, PAYMENT-SIGNATURE).
pay = [
    "x402[evm]>=2.20,<3",  # 2.20 added client spend_controls
    "eth-account>=0.13",
]
# Also pay in USDC on Solana; use together with pay: cerebrus-pulse[pay,svm].
# solana 0.40+ dropped solana.rpc.api, which the x402 SVM client imports, and
# x402 declares solana without an upper bound, so pin the last working line.
svm = [
    "x402[svm]>=2.20,<3",
    "solana>=0.36,<0.37",
    "solders>=0.27,<0.28",
]
test = [
    "pytest>=8",
]

[project.urls]
Homepage = "https://cerebruspulse.xyz"
Documentation = "https://cerebruspulse.xyz/guides/python-sdk"
Repository = "https://github.com/0xsl1m/cerebrus-pulse-python"
Issues = "https://github.com/0xsl1m/cerebrus-pulse-python/issues"

# hatch_build.py refuses to build a release while DEFAULT_ALLOWED_PAYTO is a
# payTo being replaced. Editable installs are not checked.
[tool.hatch.build.hooks.custom]
